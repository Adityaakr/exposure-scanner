# Datadog's browser SDK sends to one intake host per Datadog site.
[[sdk]]
rule = "sdk/datadog-rum"
block = [
    "browser-intake-datadoghq.com",
    "browser-intake-us3-datadoghq.com",
    "browser-intake-us5-datadoghq.com",
    "browser-intake-datadoghq.eu",
    "browser-intake-ap1-datadoghq.com",
    "browser-intake-ap2-datadoghq.com",
    "browser-intake-uk1-datadoghq.com",
    "browser-intake-ddog-gov.com",
    "browser-intake-us2-ddog-gov.com",
]
sources = ["https://docs.datadoghq.com/integrations/content_security_policy_logs/"]

# Statsig's list also names cloudflare-dns.com, a public DNS resolver that is
# not Statsig's: blocking it is left out. Statsig says it changes these
# domains from time to time.
[[sdk]]
rule = "sdk/statsig"
block = [
    "api.statsig.com",
    "featuregates.org",
    "statsigapi.net",
    "events.statsigapi.net",
    "api.statsigcdn.com",
    "featureassets.org",
    "assetsconfigcdn.org",
    "prodregistryv2.org",
    "beyondwickedmapping.org",
]
sources = ["https://docs.statsig.com/infrastructure/statsig_domains"]

# Google Analytics for Firebase sends app events to app-measurement.com, and
# the web SDK to the google-analytics.com and analytics.google.com hosts.
[[sdk]]
rule = "sdk/google-analytics"
block = [
    "app-measurement.com",
    "region1.app-measurement.com",
    "google-analytics.com",
    "region1.google-analytics.com",
    "analytics.google.com",
    "region1.analytics.google.com",
]
sources = [
    "https://storage.googleapis.com/support-kms-prod/LnQ8X4K0alkkQM5zyK7Wm0gkk1ETJIoSeNNk",
    "https://support.google.com/analytics/answer/12017362",
]
