[[app]]
id = "cmux"
name = "cmux"
apps = [{ platform = "macos", id = "com.cmuxterm.app" }]
sources = [
    "https://github.com/manaflow-ai/cmux/blob/4c944767c3a8632b7cbb9b0516ee369e0819479c/Packages/macOS/CmuxSettings/Sources/CmuxSettings/Keys/AppCatalogSection.swift",
    "https://github.com/manaflow-ai/cmux/blob/4c944767c3a8632b7cbb9b0516ee369e0819479c/Resources/Localizable.xcstrings",
    "https://github.com/manaflow-ai/cmux/blob/4c944767c3a8632b7cbb9b0516ee369e0819479c/Sources/App/MacSentryStartupPolicy.swift",
    "https://github.com/manaflow-ai/cmux/blob/4c944767c3a8632b7cbb9b0516ee369e0819479c/Sources/TelemetrySettings.swift",
]

[[app.setting]]
covers = ["analytics", "crash_reporting"]
steps = "Settings > App, then turn off Send anonymous telemetry"
