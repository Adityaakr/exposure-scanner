# What a person can do about a finding, where that depends on one app or one
# SDK. Data in this directory is licensed CC BY 4.0 (see ../README.md).
#
# [[app]]  What an app's publisher documents about turning off what the app
#          sends: a setting and the categories of pack.toml it covers, or a
#          statement that the publisher documents none. Write the steps in
#          the words of the app's own menus, from the publisher's own pages,
#          and nothing those pages do not show. An app with no entry is shown
#          with "no setting on record", which is the honest answer for an app
#          nobody has sourced.
# [[sdk]]  Hosts an SDK sends to beyond those its rule names, for the block
#          list the report gives. Only for a rule in a counted category, and
#          only hosts the vendor's own documentation names.
#
# Checked against the publishers' pages on 2026-11-18, and on 2026-11-22 for
# Trezor Suite's crash reports and every entry after Claude's.

[[app]]
id = "vscode"
name = "Visual Studio Code"
apps = [
    { platform = "macos", id = "com.microsoft.VSCode" },
    { platform = "macos", id = "com.microsoft.VSCodeInsiders" },
]
sources = [
    "https://code.visualstudio.com/docs/configure/telemetry",
    "https://code.visualstudio.com/docs/configure/settings",
    "https://vscodium.com/",
]

[[app.setting]]
covers = ["analytics", "crash_reporting", "telemetry"]
steps = "open Settings (⌘,), search for telemetry.telemetryLevel and set it to off"
note = "Extensions you installed may collect usage data of their own, which this setting does not cover."

[[app.alternative]]
name = "VSCodium"
website = "https://vscodium.com/"
about = "the same editor, built from the same open source code without Microsoft's telemetry"

[[app]]
id = "cursor"
name = "Cursor"
apps = [{ platform = "macos", id = "com.todesktop.230313mzl4w4u92" }]
sources = [
