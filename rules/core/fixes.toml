    "https://cursor.com/security",
]

[[app.no_setting]]
covers = ["analytics", "crash_reporting"]
says = "Cursor documents no setting for its usage analytics or crash reports. Its Privacy Mode (Cursor Settings > General > Privacy Mode) is about training AI models on your code, not about these."

