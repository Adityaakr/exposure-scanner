id = "sdk/electron-updater"
name = "electron-updater"
# The updater of electron-builder. It fetches the feed the app's own developer
# names in the app-update.yml file it reads.
component = true
category = "component"
sources = [
    "https://registry.npmjs.org/electron-updater/-/electron-updater-6.8.11.tgz",
]

[match]
npm_package = ["electron-updater"]
content_literal = [{ lit = "app-update.yml", at = "word" }]

# Logseq 2.0.2 for macOS on Apple silicon (tests/fixtures/README.md).
