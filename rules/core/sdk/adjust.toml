id = "sdk/adjust"
name = "Adjust"
entity = "adjust"
category = "attribution"
sources = [
    "https://raw.githubusercontent.com/adjust/ios_sdk/HEAD/Adjust.xcodeproj/project.pbxproj",
    "https://raw.githubusercontent.com/adjust/ios_sdk/HEAD/Adjust/ADJAttribution.m",
    "https://raw.githubusercontent.com/adjust/ios_sdk/HEAD/Adjust/ADJConfig.m",
    "https://raw.githubusercontent.com/adjust/ios_sdk/HEAD/Adjust/Internal/ADJActivityHandler.m",
    "https://raw.githubusercontent.com/adjust/ios_sdk/HEAD/Adjust/Internal/ADJUrlStrategy.m",
    "https://repo1.maven.org/maven2/com/adjust/sdk/adjust-android/5.8.1/adjust-android-5.8.1.aar",
]

# Its endpoint hosts are strings an app that filters ad or tracking traffic can
# hold as data, so two different ones must be in one file, a DEX file or a
# binary, to count.
[match]
manifest_component = ["com.adjust.sdk.SystemLifecycleContentProvider"]
android_class_prefix = ["com.adjust.sdk."]
dex_string = [
    { lit = "app.adjust.com", at = "host" },
    { lit = "gdpr.adjust.com", at = "host" },
    { lit = "subscription.adjust.com", at = "host" },
]
apple_framework = ["AdjustSdk.framework"]
macho_objc_class = ["ADJActivityHandler", "ADJAttribution", "ADJConfig"]
macho_token = [
    { lit = "analytics.adjust.com", at = "host" },
    { lit = "gdpr.adjust.com", at = "host" },
    { lit = "subscription.adjust.com", at = "host" },
]
min_distinct = { dex_string = 2, macho_token = 2 }
