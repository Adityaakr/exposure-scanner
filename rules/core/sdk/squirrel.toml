id = "sdk/squirrel"
name = "Squirrel"
# The update framework Electron's built-in updater uses on macOS. It fetches the
# feed the app's own developer names.
component = true
category = "component"
sources = [
    "https://raw.githubusercontent.com/Squirrel/Squirrel.Mac/HEAD/Squirrel/SQRLDownloadedUpdate.m",
    "https://raw.githubusercontent.com/Squirrel/Squirrel.Mac/HEAD/Squirrel/SQRLShipItLauncher.m",
    "https://raw.githubusercontent.com/Squirrel/Squirrel.Mac/HEAD/Squirrel/SQRLUpdater.m",
    "https://raw.githubusercontent.com/electron/electron/HEAD/BUILD.gn",
]

[match]
apple_framework = ["Squirrel.framework"]
macho_objc_class = ["SQRLDownloadedUpdate", "SQRLShipItLauncher", "SQRLUpdater"]

# Logseq 2.0.2 for macOS on Apple silicon (tests/fixtures/README.md).
[[fixture]]
sha256 = "ffd6e086ba6f68a4748f80eaa8b38244a9cf78b05c076343d75e0230fe9440b4"
url = "https://github.com/logseq/logseq/releases/download/2.0.2/Logseq-darwin-arm64-2.0.2.zip"
expect = ["apple_framework"]

