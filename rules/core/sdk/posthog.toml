id = "sdk/posthog"
name = "PostHog"
entity = "posthog"
category = "analytics"
sources = [
    "https://raw.githubusercontent.com/PostHog/posthog-js/main/packages/browser/package.json",
    "https://raw.githubusercontent.com/PostHog/posthog-js/main/packages/node/package.json",
    "https://raw.githubusercontent.com/PostHog/posthog-js/main/packages/browser/src/posthog-core.ts",
    "https://raw.githubusercontent.com/PostHog/posthog-js/main/packages/browser/src/utils/request-router.ts",
    "https://raw.githubusercontent.com/PostHog/posthog-android/main/posthog-android/build.gradle.kts",
    "https://raw.githubusercontent.com/PostHog/posthog-android/main/posthog/src/main/java/com/posthog/PostHogConfig.kt",
    "https://raw.githubusercontent.com/PostHog/posthog-ios/main/PostHog.xcodeproj/project.pbxproj",
]

# The Android prefix is com.posthog.android. and not com.posthog., because the
# same repository ships a server-side JVM SDK under com.posthog.server.
[match]
android_class_prefix = ["com.posthog.android."]
dex_string = [
    { lit = "eu.i.posthog.com", at = "host" },
    { lit = "us.i.posthog.com", at = "host" },
]
npm_package = ["posthog-js", "posthog-node"]
apple_framework = ["PostHog.framework"]
content_literal = [
    { lit = "i.posthog.com", at = "host" },
    { lit = "us.i.posthog.com", at = "host" },
]
