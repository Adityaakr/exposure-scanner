id = "sdk/applovin"
name = "AppLovin MAX"
entity = "applovin"
category = "advertising"
sources = [
    "https://artifacts.applovin.com/ios/com/applovin/applovin-sdk/AppLovinSDK-13.7.0.xcframework.zip",
    "https://repo1.maven.org/maven2/com/applovin/applovin-sdk/13.7.0/applovin-sdk-13.7.0.aar",
]

# Its endpoint hosts are strings an app that filters ad or tracking traffic can
# hold as data, so two different ones must be in one DEX file to count.
[match]
manifest_component = [
    "com.applovin.adview.AppLovinFullscreenActivity",
    "com.applovin.sdk.AppLovinInitProvider",
    "com.applovin.sdk.AppLovinWebViewActivity",
]
android_class_prefix = ["com.applovin."]
apk_file = [
    "lib/arm64-v8a/libapplovin-native-crash-reporter.so",
    "lib/armeabi-v7a/libapplovin-native-crash-reporter.so",
    "lib/x86/libapplovin-native-crash-reporter.so",
    "lib/x86_64/libapplovin-native-crash-reporter.so",
]
dex_string = [{ lit = "ms.applovin.com", at = "host" }, { lit = "rt.applovin.com", at = "host" }]
apple_framework = ["AppLovinSDK.framework"]
macho_objc_class = ["ALAdService", "ALEventService", "ALSdk", "MAAdView"]
macho_token = [{ lit = "ms.applovin.com", at = "host" }, { lit = "rt.applovin.com", at = "host" }]
min_distinct = { dex_string = 2 }
