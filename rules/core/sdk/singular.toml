id = "sdk/singular"
name = "Singular"
entity = "singular"
category = "attribution"
sources = [
    "https://maven.singular.net/com/singular/sdk/singular_sdk/12.17.0/singular_sdk-12.17.0.aar",
    "https://raw.githubusercontent.com/singular-labs/Singular-iOS-SDK/HEAD/Singular.xcframework/ios-arm64/Singular.framework/Headers/Attributes.h",
    "https://raw.githubusercontent.com/singular-labs/Singular-iOS-SDK/HEAD/Singular.xcframework/ios-arm64/Singular.framework/Headers/SingularConfig.h",
    "https://raw.githubusercontent.com/singular-labs/Singular-iOS-SDK/HEAD/Singular.xcframework/ios-arm64/Singular.framework/Headers/SingularLinkParams.h",
    "https://raw.githubusercontent.com/singular-labs/Singular-iOS-SDK/HEAD/Singular.xcframework/ios-arm64/Singular.framework/PrivacyInfo.xcprivacy",
]

[match]
android_class_prefix = ["com.singular.sdk."]
dex_string = [{ lit = "sdk-api-v1.singular.net", at = "host" }]
apple_framework = ["Singular.framework"]
macho_objc_class = ["SingularConfig", "SingularLinkParams"]
privacy_manifest = [{ lit = "safetrack.singular.net", at = "host" }]
