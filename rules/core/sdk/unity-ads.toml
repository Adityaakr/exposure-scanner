id = "sdk/unity-ads"
name = "Unity Ads"
entity = "unity"
category = "advertising"
sources = [
    "https://raw.githubusercontent.com/Unity-Technologies/unity-ads-ios/HEAD/SourceCode/Private/Core/Properties/USRVSdkProperties.m",
    "https://raw.githubusercontent.com/Unity-Technologies/unity-ads-ios/HEAD/SourceCode/Public/Ads/MetaData/UADSMetaData.m",
    "https://raw.githubusercontent.com/Unity-Technologies/unity-ads-ios/HEAD/SourceCode/Public/UnityAdvertisement.m",
    "https://raw.githubusercontent.com/Unity-Technologies/unity-ads-ios/HEAD/UnityAds.podspec",
    "https://repo1.maven.org/maven2/com/unity3d/ads/unity-ads/4.22.0/unity-ads-4.22.0.aar",
]

# Its endpoint hosts are strings an app that filters ad or tracking traffic can
# hold as data, so two different ones must be in one DEX file to count.
[match]
manifest_component = [
    "com.unity3d.ads.adplayer.FullScreenWebViewDisplay",
    "com.unity3d.services.core.configuration.AdsSdkInitializer",
]
android_class_prefix = ["com.unity3d.ads.", "com.unity3d.services."]
dex_string = [
    { lit = "gateway.unityads.unity3d.com", at = "host" },
    { lit = "webview.unityads.unity3d.com", at = "host" },
]
apple_framework = ["UnityAds.framework"]
macho_objc_class = ["UADSMetaData", "USRVSdkProperties", "UnityAds"]
min_distinct = { dex_string = 2 }
