# The project's own rule layer. Data in this directory is licensed CC BY 4.0
# (see ../README.md).
layer = "core"
version = 5
license = "CC-BY-4.0"

# The fixed list of categories. Only the five marked `headline` count in a
# report's headline numbers: hosting is not receiving, so crash reporting,
# push delivery and payment plumbing are kept apart from analytics and
# advertising.

[[category]]
id = "advertising"
name = "Advertising"
headline = true

[[category]]
id = "analytics"
name = "Analytics"
headline = true

[[category]]
id = "attribution"
name = "Attribution"
headline = true

[[category]]
id = "profiling"
name = "Profiling"
headline = true

[[category]]
id = "session_replay"
name = "Session replay"
headline = true


[[category]]
id = "crash_reporting"
name = "Crash reporting"
headline = false

[[category]]
id = "push_messaging"
name = "Push messaging"
headline = false

# Messaging platforms an app reports its user to, by identity and by what the
# user does, so that the platform can choose and send messages: in-app chat,
# campaigns, push. Not in the headline: the five headline categories are a
# fixed list (design report, section 3, A7).
[[category]]
id = "customer_messaging"
name = "Customer messaging"
headline = false

[[category]]
id = "payments"
name = "Payments"
headline = false

[[category]]
id = "identifiers"
name = "Installation identifiers"
headline = false

[[category]]
id = "telemetry"
name = "Telemetry transport"
headline = false

# Where an app fetches its own updates from, as its property list declares.
# Hosting is not receiving.
[[category]]
id = "update_feed"
name = "Update feed"
headline = false

# A domain a privacy manifest lists under NSPrivacyTrackingDomains. It is
# shown as the app declares it, under the company that operates it when
# entities.toml lists the domain. It does not count in the headline by
# itself: only endpoints a rule names count, and a rule that names the host
# reports it under the rule's own category.
[[category]]
id = "tracking_domain"
name = "Declared tracking domain"
headline = false

# A library with no network side of its own. Never a company edge.
[[category]]
id = "component"
name = "Component"
headline = false
