name: nightly

# What is too slow or too costly for every change: the whole negative-control
# corpus, and the reproducible-build check on both platforms (design report,
# section 9, tasks 13 and 14). It runs nightly, on merges and on demand, and
# on pull requests that change this workflow, the corpus or the build.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/nightly.yml"
      - "tests/fixtures/negative-apps.txt"
      - "crates/xs-cli/build.rs"
      - "xtask/src/repro.rs"
      - "rust-toolchain.toml"

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  negative-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install || rustup show

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: linux-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: linux-

      # Apps are pinned by hash and never stored in the repository. The
      # cache spares their publishers a download on every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/negative-apps
          key: negative-apps-all-${{ hashFiles('tests/fixtures/negative-apps.txt') }}

      - name: Fetch every negative-control app
        run: cargo xtask fixtures negatives --dir "$RUNNER_TEMP/negative-apps" --all

      - name: No negative-control app has a channel to another company
        run: cargo test --locked --all-features -p exposure --test negative_corpus -- --nocapture
        env:
          EXPOSURE_NEGATIVE_CACHE: ${{ runner.temp }}/negative-apps
          EXPOSURE_NEGATIVE_SET: all

  # Two release builds of the commit, each from its own copy at its own
  # path, must give the same binary. macOS on Apple silicon is the platform
  # the binary is for; Linux is checked too, for the portable core.
  reproducible:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install || rustup show

      - name: Two clean builds of this commit give one binary
        run: cargo xtask repro HEAD
