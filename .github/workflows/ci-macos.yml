name: ci-macos

# macOS on Apple silicon is the first supported platform, so the scanner is
# built and tested there too. To keep the cost down in a private repository
# this runs on merges, nightly and on demand, and on pull requests only when
# the workflows or the toolchain change (design report, section 10.2).
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "rust-toolchain.toml"

permissions:
  contents: read

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The differential test builds the commit before this one.
          fetch-depth: 0

      - name: Install the pinned toolchain
        run: rustup toolchain install || rustup show

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: macos-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: macos-

      - name: Tests (determinism, honesty, hostile inputs, pack lints)
        run: cargo test --locked --workspace --all-features

      - name: Rule pack is fresh, reproducible and signed
        run: cargo xtask pack check

      - name: A scan opens no socket
        run: cargo xtask no-network --strict

      # macOS schedules small files on fewer threads than other systems
      # (xs-collect/src/schedule.rs), so the reports of the two builds are
      # compared here too, over the committed fixtures and the corpus made
      # from the rule pack. See ci.yml.
      - name: Every report is the base commit's
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          trap 'rm -rf target/difftest' EXIT
          expect=""
          if ! git diff --quiet "$BASE" HEAD -- rules ':(glob)tests/fixtures/**/*.report.*'; then
            expect="--expect-changes"
          fi
          cargo xtask difftest --base "$BASE" $expect
