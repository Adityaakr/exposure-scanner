name: ci

# Linux runs every check on every change. The macOS job lives in
# ci-macos.yml and runs on merges and nightly: macOS runner minutes cost ten
# times as much in a private repository (design report, section 10.2).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_DENY_VERSION: "0.21.0"
  CARGO_DENY_SHA256: a2170b854ff697e79e39c4c538981c9c1bdd803addbae6719a4cb66b4585a903

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install || rustup show

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: linux-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: linux-

      - name: Install cargo-deny (pinned by hash), strace and time
        run: |
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/cargo-deny.tgz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${archive}.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/cargo-deny.tgz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/cargo-deny.tgz" --directory "$RUNNER_TEMP" "${archive}/cargo-deny"
          install -m 0755 "$RUNNER_TEMP/${archive}/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
          { command -v strace >/dev/null && test -x /usr/bin/time; } || { sudo apt-get update --quiet && sudo apt-get install --yes --quiet strace time; }

      # Real apps are pinned by hash in tests/fixtures/real-apps.txt and
      # never stored in the repository. The cache spares their publishers a
      # download on every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/real-apps
          key: real-apps-${{ hashFiles('tests/fixtures/real-apps.txt') }}

      - name: Fetch the pinned real apps
        run: cargo xtask fixtures fetch --dir "$RUNNER_TEMP/real-apps"

      # The negative-control corpus: the subset scanned on every change.
      # The nightly workflow scans all of it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/negative-apps
          key: negative-apps-every-change-${{ hashFiles('tests/fixtures/negative-apps.txt') }}

      - name: Fetch the negative-control apps scanned on every change
        run: cargo xtask fixtures negatives --dir "$RUNNER_TEMP/negative-apps"

      - name: Format
        run: cargo fmt --all --check

      - name: Lints (the API bans are lints)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Tests (determinism, honesty, hostile inputs, pack lints)
        run: cargo test --locked --workspace --all-features

      # Only this test file is given the cache: it holds the Android
      # packages, and the Electron and macOS tests read the same variable
      # and would fail on the macOS apps that are not fetched here.
      - name: Tests on the pinned real apps
        run: cargo test --locked --all-features -p exposure --test android_real_apps
        env:
          EXPOSURE_FIXTURE_CACHE: ${{ runner.temp }}/real-apps

      - name: No negative-control app has a channel to another company
        run: cargo test --locked --all-features -p exposure --test negative_corpus -- --nocapture
        env:
          EXPOSURE_NEGATIVE_CACHE: ${{ runner.temp }}/negative-apps

      - name: Pure crates build without the standard library
        run: cargo build --locked --target wasm32v1-none -p xs-model -p xs-match -p xs-derive -p xs-render

      - name: Dependency bans, licences and advisories
        run: cargo deny check

      - name: Rule pack is fresh, reproducible and signed
        run: cargo xtask pack check

      - name: Guardrails bite
        run: cargo xtask guardrails

      - name: A scan opens no socket
        run: cargo xtask no-network --strict

      # The committed fixtures are far too small for the scaling gate, which
      # is skipped here and is checked on the reference laptop with
      # `cargo xtask bench --strict`, as are the absolute cold-scan (60 s)
      # and warm-scan (5 s) gates on the apps installed there. What this run
      # does check: the benchmark itself works, memory stays under its gate,
      # a scan that finds its cache full reads nothing, and 17 runs at 1 to
      # 8 threads, with the cache off, empty and full, give one report.
      - name: Benchmark runs, within its memory gate, with one report
        run: cargo xtask bench tests/fixtures/macos tests/fixtures/android/Skeleton.apk

  # The parsers of hostile files, under libFuzzer with the address
  # sanitizer: one target per parser and one for the Android collector as a
  # whole, 60 s each, seeded from the committed fixture.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_FUZZ_VERSION: "0.13.2"
      CARGO_FUZZ_SHA256: b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the nightly toolchain pinned in fuzz/
        working-directory: fuzz
        run: rustup toolchain install || rustup show

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            fuzz/target
          key: fuzz-${{ hashFiles('fuzz/rust-toolchain.toml', 'fuzz/Cargo.lock') }}
          restore-keys: fuzz-

      - name: Install cargo-fuzz (pinned by hash)
        run: |
          archive="cargo-fuzz-${CARGO_FUZZ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rust-fuzz/cargo-fuzz/releases/download/${CARGO_FUZZ_VERSION}/${archive}"
          echo "${CARGO_FUZZ_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" cargo-fuzz
          install -m 0755 "$RUNNER_TEMP/cargo-fuzz" "$HOME/.cargo/bin/cargo-fuzz"

      - name: Every fuzz target runs clean for 60 s
        run: fuzz/run.sh 60
