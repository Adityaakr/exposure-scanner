# Lint configuration for xs-rules: the workspace list (see ../../clippy.toml,
# kept in step by hand because clippy does not merge configuration files)
# plus a ban on the file-system API. The rule-pack loader takes bytes and
# touch nothing else, so the result cannot depend on anything but the input.

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true
allow-indexing-slicing-in-tests = true

# Determinism (design report, section 6.4 rule 5): nothing whose behaviour
# depends on a random seed, the clock or the environment.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is randomly seeded; use BTreeMap" },
    { path = "std::collections::HashSet", reason = "iteration order is randomly seeded; use BTreeSet" },
    { path = "std::time::Instant", reason = "limits are counts, never durations" },
    { path = "std::time::SystemTime", reason = "a report holds no timestamp" },
    { path = "std::net::TcpStream", reason = "the scanner opens no sockets" },
    { path = "std::net::TcpListener", reason = "the scanner opens no sockets" },
    { path = "std::net::UdpSocket", reason = "the scanner opens no sockets" },
    { path = "std::os::unix::net::UnixStream", reason = "the scanner opens no sockets" },
    { path = "std::os::unix::net::UnixDatagram", reason = "the scanner opens no sockets" },
    { path = "std::os::unix::net::UnixListener", reason = "the scanner opens no sockets" },
    { path = "std::process::Command", reason = "the scanner executes nothing" },
    { path = "std::fs::File", reason = "this crate takes bytes; only xs-collect opens files" },
    { path = "std::fs::OpenOptions", reason = "this crate takes bytes; only xs-collect opens files" },
    { path = "std::fs::ReadDir", reason = "this crate takes bytes; only xs-collect opens files" },
    { path = "std::fs::DirBuilder", reason = "this crate takes bytes; only xs-collect opens files" },
]
disallowed-methods = [
    { path = "std::env::var", reason = "output must not depend on the environment" },
    { path = "std::env::var_os", reason = "output must not depend on the environment" },
    { path = "std::env::vars", reason = "output must not depend on the environment" },
    { path = "std::env::vars_os", reason = "output must not depend on the environment" },
    { path = "std::env::current_dir", reason = "output must not depend on where the scanner runs" },
    { path = "std::env::temp_dir", reason = "output must not depend on the environment" },
    { path = "std::thread::sleep", reason = "limits are counts, never durations" },
    { path = "std::fs::read", reason = "this crate takes bytes; only xs-collect opens files" },
    { path = "std::fs::read_to_string", reason = "this crate takes bytes; only xs-collect opens files" },
    { path = "std::fs::read_dir", reason = "this crate takes bytes; only xs-collect opens files" },
    { path = "std::fs::read_link", reason = "this crate takes bytes; only xs-collect opens files" },
    { path = "std::fs::write", reason = "this crate takes bytes; only xs-collect opens files" },
    { path = "std::fs::metadata", reason = "this crate takes bytes; only xs-collect opens files" },
    { path = "std::fs::symlink_metadata", reason = "this crate takes bytes; only xs-collect opens files" },
    { path = "std::fs::canonicalize", reason = "this crate takes bytes; only xs-collect opens files" },
    { path = "std::fs::exists", reason = "this crate takes bytes; only xs-collect opens files" },
    { path = "std::fs::copy", reason = "this crate takes bytes; only xs-collect opens files" },
    { path = "std::fs::rename", reason = "this crate takes bytes; only xs-collect opens files" },
    { path = "std::fs::remove_file", reason = "this crate takes bytes; only xs-collect opens files" },
    { path = "std::fs::remove_dir", reason = "this crate takes bytes; only xs-collect opens files" },
    { path = "std::fs::remove_dir_all", reason = "this crate takes bytes; only xs-collect opens files" },
    { path = "std::fs::create_dir", reason = "this crate takes bytes; only xs-collect opens files" },
    { path = "std::fs::create_dir_all", reason = "this crate takes bytes; only xs-collect opens files" },
    { path = "std::path::Path::exists", reason = "this crate takes bytes; only xs-collect opens files" },
    { path = "std::path::Path::is_file", reason = "this crate takes bytes; only xs-collect opens files" },
    { path = "std::path::Path::is_dir", reason = "this crate takes bytes; only xs-collect opens files" },
    { path = "std::path::Path::metadata", reason = "this crate takes bytes; only xs-collect opens files" },
    { path = "std::path::Path::read_dir", reason = "this crate takes bytes; only xs-collect opens files" },
    { path = "std::path::Path::canonicalize", reason = "this crate takes bytes; only xs-collect opens files" },
]
