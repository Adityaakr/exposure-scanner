[package]
name = "xs-render"
description = "Pure renderers that turn claims and evidence into report documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
xs-model.workspace = true
serde.workspace = true

[features]
# Test support for this crate's and other crates' tests: a strict reader of
# the HTML report and the check that a report is inert. Only
# dev-dependencies enable it, so it is never part of the shipped scanner.
testkit = []

[dev-dependencies]
# Tests render the claims derivation really produces.
xs-derive.workspace = true
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
